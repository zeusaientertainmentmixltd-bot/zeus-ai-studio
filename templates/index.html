
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEUS AI ENTERTAINMENT MIX LIMITED</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0e1117; color: #fff; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: auto; background: #161b22; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 100px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 5px; padding: 10px; font-size: 16px; margin-bottom: 15px; }
        button { background: #238636; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2ea043; }
        #result { margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ZEUS AI Studio</h2>
        <p>Autonomous Film & Media Production Pipeline</p>
        <textarea id="prompt" placeholder="Enter your movie concept or script prompt here..."></textarea><br>
        <button onclick="generateVideo()">Generate AI Video</button>
        <div id="result"></div>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('prompt').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "<p>Generating script, audio, and rendering video... Please wait (this can take up to a minute).</p>";

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    resultDiv.innerHTML = `
                        <h3>Generated Script:</h3>
                        <p style="background: #0d1117; padding: 10px; border-radius: 5px;">${data.script}</p>
                        <h3>Rendered Output:</h3>
                        <video width="100%" controls src="${data.video_url}"></video>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: #f85149;">Error: ${data.message}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color: #f85149;">Request failed: ${err}</p>`;
            }
        }
    </script>
</body>
</html>
